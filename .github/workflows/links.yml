name: 출처 링크 점검
on:
  workflow_dispatch:
  push: { branches: [main], paths: ['tools/check_links.py', '.github/workflows/links.yml'] }
  schedule: [{ cron: '17 18 * * 0' }]
permissions: { contents: write }
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: python3 tools/check_links.py data/seed.json /tmp/link_report.json
      - name: 결과를 link-report 브랜치에 저장(사이트 배포와 무관)
        run: |
          git config user.name "link-check-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan link-report
          git rm -rq --cached . && git clean -fdq -e .git
          cp /tmp/link_report.json link_report.json
          git add link_report.json && git commit -qm "출처 링크 점검 결과"
          git push -f origin link-report
